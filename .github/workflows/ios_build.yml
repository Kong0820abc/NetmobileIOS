name: iOS CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Install CocoaPods Dependencies
      run: |
        cd iosApp
        rm -rf Pods Podfile.lock iosApp.xcworkspace
        
        cat <<EOF > Podfile
        platform :ios, '15.0'
        # 强制开启模块化支持
        use_modular_headers!
        
        target 'iosApp' do
          # 回归标准动态链接，但配合 post_install 强力修复
          use_frameworks!
          pod 'FirebaseDatabase'
          pod 'FirebaseCore'
          pod 'GoogleUtilities'
        end

        post_install do |installer|
          installer.generated_projects.each do |project|
            project.targets.each do |target|
              target.build_configurations.each do |config|
                # 修复 FirebaseCoreInternal 找不到 GoogleUtilities 的核心配置
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
                config.build_settings['DEFINES_MODULE'] = 'YES'
                config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'
                config.build_settings['ONLY_ACTIVE_ARCH'] = 'NO'
              end
            end
          end
        end
        EOF
        pod install --repo-update

    - name: Build Kotlin Framework
      run: ./gradlew :shared:linkReleaseFrameworkIosArm64

    - name: Build iOS App (Unsigned)
      run: |
        cd iosApp
        # 直接使用探测到的 iosApp 方案
        xcodebuild -workspace iosApp.xcworkspace \
                   -scheme iosApp \
                   -destination 'generic/platform=iOS' \
                   -configuration Release \
                   -derivedDataPath build_data \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_IDENTITY="" \
                   AD_HOC_CODE_SIGNING_ALLOWED=YES \
                   ENABLE_USER_SCRIPT_SANDBOXING=NO \
                   COMPILER_INDEX_STORE_ENABLE=NO \
                   IS_APPLE_CODE_SIGN_PARAMETER_REQUIRED=NO \
                   FRAMEWORK_SEARCH_PATHS="$(pwd)/../shared/build/bin/iosArm64/releaseFramework" \
                   CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES=YES \
                   OTHER_SWIFT_FLAGS="-Xcc -Wno-error=non-modular-include-in-framework-module" \
                   build

    - name: Prepare Artifact for Upload
      run: |
        mkdir -p final_ipa_dir
        # 提取结果，排除掉干扰目录
        find build_data -name "*.app" -type d -path "*/Release-iphoneos/*" -exec cp -R "{}" final_ipa_dir/ \;
        echo "Final Apps Captured:"
        ls -R final_ipa_dir

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-app-unsigned
        path: final_ipa_dir/
        if-no-files-found: error
