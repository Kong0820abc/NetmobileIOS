workflows:
  ios-simulator-appetize:
    name: iOS Simulator (For Appetize.io)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        XCODE_WORKSPACE: "iosApp/iosApp.xcworkspace"
        XCODE_SCHEME: "iosApp"
      node: 20
      java: 17
      xcode: latest
    scripts:
      - name: Set execute permission
        script: chmod +x gradlew
      - name: Install Pods and Fix Assets
        script: |
          cd iosApp
          rm -rf iosApp/Preview\ Content
          sips -s format png --padToHeightWidth 1024 1024 "../androidApp/src/main/res/drawable/logo.png" --out "iosApp/Assets.xcassets/AppIcon.appiconset/app-icon-1024.png"
          sips -s formatProperties '{"hasAlpha":false}' "iosApp/Assets.xcassets/AppIcon.appiconset/app-icon-1024.png"
          cat <<EOF > iosApp/Assets.xcassets/AppIcon.appiconset/Contents.json
          { "images": [ { "filename": "app-icon-1024.png", "idiom": "universal", "platform": "ios", "size": "1024x1024" } ], "info": { "author": "xcode", "version": 1 } }
          EOF
          cat <<EOF > Podfile
          platform :ios, '15.0'
          target 'iosApp' do
            use_frameworks! :linkage => :static
            pod 'FirebaseDatabase'
            pod 'FirebaseCore'
            pod 'FirebaseCoreInternal'
            pod 'GoogleUtilities'
          end
          post_install do |installer|
            installer.generated_projects.each { |p| p.targets.each { |t| t.build_configurations.each { |c| c.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'; c.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'; c.build_settings['DEFINES_MODULE'] = 'YES' } } }
          end
          EOF
          pod install
      - name: Build KMP Framework (Simulator)
        script: ./gradlew :shared:linkReleaseFrameworkIosSimulatorArm64
      - name: Build iOS App (Simulator)
        script: |
          xcodebuild build -workspace "$XCODE_WORKSPACE" -scheme "$XCODE_SCHEME" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Package for Appetize
        script: |
          APP_PATH=$(find $HOME/Library/Developer/Xcode/DerivedData -name "*.app" -type d | grep "Release-iphonesimulator" | head -n 1)
          APP_NAME=$(basename "$APP_PATH")
          cd $(dirname "$APP_PATH")
          # 核心修复：使用引号包裹变量，防止空格导致 zip 失败
          zip -r "$GITHUB_WORKSPACE/TurfMobile_Simulator.zip" "$APP_NAME"
    artifacts:
      - "*.zip"

  ios-device-unsigned:
    name: iOS Physical Device (For Sideloadly)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        XCODE_WORKSPACE: "iosApp/iosApp.xcworkspace"
        XCODE_SCHEME: "iosApp"
      node: 20
      java: 17
      xcode: latest
    scripts:
      - name: Set execute permission
        script: chmod +x gradlew
      - name: Install Pods and Fix Assets
        script: |
          cd iosApp
          rm -rf iosApp/Preview\ Content
          sips -s format png --padToHeightWidth 1024 1024 "../androidApp/src/main/res/drawable/logo.png" --out "iosApp/Assets.xcassets/AppIcon.appiconset/app-icon-1024.png"
          sips -s formatProperties '{"hasAlpha":false}' "iosApp/Assets.xcassets/AppIcon.appiconset/app-icon-1024.png"
          cat <<EOF > iosApp/Assets.xcassets/AppIcon.appiconset/Contents.json
          { "images": [ { "filename": "app-icon-1024.png", "idiom": "universal", "platform": "ios", "size": "1024x1024" } ], "info": { "author": "xcode", "version": 1 } }
          EOF
          cat <<EOF > Podfile
          platform :ios, '15.0'
          target 'iosApp' do
            use_frameworks! :linkage => :static
            pod 'FirebaseDatabase'
            pod 'FirebaseCore'
            pod 'FirebaseCoreInternal'
            pod 'GoogleUtilities'
          end
          post_install do |installer|
            installer.generated_projects.each { |p| p.targets.each { |t| t.build_configurations.each { |c| c.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'; c.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'; c.build_settings['DEFINES_MODULE'] = 'YES' } } }
          end
          EOF
          pod install
      - name: Build KMP Framework (Device)
        script: ./gradlew :shared:linkReleaseFrameworkIosArm64
      - name: Build iOS App (Device)
        script: |
          xcodebuild build -workspace "$XCODE_WORKSPACE" -scheme "$XCODE_SCHEME" -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Package IPA
        script: |
          APP_PATH=$(find $HOME/Library/Developer/Xcode/DerivedData -name "*.app" -type d | grep "Release-iphoneos" | head -n 1)
          mkdir -p Payload
          # 核心修复：使用引号包裹路径，防止空格导致 cp 失败
          cp -R "$APP_PATH" Payload/
          zip -qr TurfMobile_Device.ipa Payload
          rm -rf Payload
    artifacts:
      - "*.ipa"
