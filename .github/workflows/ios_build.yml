name: iOS CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Install CocoaPods Dependencies
      run: |
        cd iosApp
        rm -rf Pods Podfile.lock iosApp.xcworkspace
        
        cat <<EOF > Podfile
        platform :ios, '15.0'
        use_modular_headers!
        
        target 'iosApp' do
          # 核心修复 1：保持动态框架，但在 CI 环境下强制开启全模块化
          use_frameworks!
          pod 'FirebaseDatabase'
          pod 'FirebaseCore'
          pod 'FirebaseCoreInternal'
          pod 'GoogleUtilities'
        end

        post_install do |installer|
          installer.pods_project.targets.each do |target|
            target.build_configurations.each do |config|
              config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
              config.build_settings['DEFINES_MODULE'] = 'YES'
              config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'
            end
          end
        end
        EOF
        pod install --repo-update

    - name: Build Kotlin Framework
      run: ./gradlew :shared:linkReleaseFrameworkIosArm64

    - name: Verify Kotlin Framework
      run: |
        ls -R shared/build/bin/iosArm64/releaseFramework
        if [ ! -d "shared/build/bin/iosArm64/releaseFramework/Shared.framework" ]; then
          echo "Error: Shared.framework not found!"
          exit 1
        fi

    - name: Build and Archive iOS App
      run: |
        cd iosApp
        # Use absolute paths for framework search to avoid relative path confusion in CI
        FRAMEWORK_PATH="$GITHUB_WORKSPACE/shared/build/bin/iosArm64/releaseFramework"
        
        xcodebuild -workspace iosApp.xcworkspace \
                   -scheme iosApp \
                   -configuration Release \
                   -archivePath build/App.xcarchive \
                   archive \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_IDENTITY="" \
                   AD_HOC_CODE_SIGNING_ALLOWED=YES \
                   ENABLE_USER_SCRIPT_SANDBOXING=NO \
                   IS_APPLE_CODE_SIGN_PARAMETER_REQUIRED=NO \
                   FRAMEWORK_SEARCH_PATHS="\$(inherited) $FRAMEWORK_PATH" \
                   OTHER_LDFLAGS="\$(inherited) -framework Shared -ObjC" \
                   SWIFT_INCLUDE_PATHS="\$(inherited) $FRAMEWORK_PATH" \
                   CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES=YES \
                   OTHER_SWIFT_FLAGS="\$(inherited) -Xcc -Wno-error=non-modular-include-in-framework-module"

    - name: Extract App from Archive
      run: |
        mkdir -p final_output
        APP_PATH=\$(find iosApp/build/App.xcarchive -name "*.app" -type d | head -n 1)
        if [ -n "\$APP_PATH" ]; then
          cp -R "\$APP_PATH" final_output/
          echo "Successfully captured: \$APP_PATH"
        else
          echo "Error: .app file not found in archive!"
          exit 1
        fi

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-app-unsigned
        path: final_output/
        if-no-files-found: error
