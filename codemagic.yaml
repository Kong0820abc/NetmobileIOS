workflows:
  ios-unsigned-workflow:
    name: iOS Unsigned Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        XCODE_WORKSPACE: "iosApp/iosApp.xcworkspace"
        XCODE_SCHEME: "iosApp"
      node: 20
      java: 17
      xcode: latest
    scripts:
      - name: Set execute permission
        script: chmod +x gradlew
      - name: Fix Assets and Podfile
        script: |
          cd iosApp
          # 1. 物理删除预览内容防止干扰
          rm -rf iosApp/Preview\ Content
          
          # 2. 强制重写 AppIcon 的 Contents.json，消除所有多余的外观定义
          cat <<EOF > iosApp/Assets.xcassets/AppIcon.appiconset/Contents.json
          {
            "images": [
              {
                "filename": "app-icon-1024.png",
                "idiom": "universal",
                "platform": "ios",
                "size": "1024x1024"
              }
            ],
            "info": { "author": "xcode", "version": 1 }
          }
          EOF

          # 3. 生成 Podfile
          cat <<EOF > Podfile
          platform :ios, '15.0'
          target 'iosApp' do
            use_frameworks! :linkage => :static
            pod 'FirebaseDatabase'
            pod 'FirebaseCore'
            pod 'FirebaseCoreInternal'
            pod 'GoogleUtilities'
          end
          post_install do |installer|
            installer.generated_projects.each do |project|
              project.targets.each do |target|
                target.build_configurations.each do |config|
                  config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
                  config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                  config.build_settings['DEFINES_MODULE'] = 'YES'
                end
              end
            end
          end
          EOF
          pod install
      - name: Build KMP Framework
        script: |
          ./gradlew :shared:linkReleaseFrameworkIosSimulatorArm64
      - name: Build iOS App
        script: |
          set -o pipefail
          # 核心修复：ASSETCATALOG 相关的全部禁用标志，彻底绕过 Thinned 错误
          xcodebuild build -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            OTHER_LDFLAGS="\$(inherited) -ObjC -Wl,-ld64" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS=NO \
            ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS=NO \
            ASSETCATALOG_COMPILER_STANDALONE_ICON_BEHAVIOR=all \
            ENABLE_ON_DEMAND_RESOURCES=NO \
            STRIP_INSTALLED_PRODUCT=NO \
            COPY_PHASE_STRIP=NO
    artifacts:
      - iosApp/build/ios/iphonesimulator/*.app
      - build/ios/iphonesimulator/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Release-iphonesimulator/*.app
    publishing:
      email:
        recipients:
          - kong0820kong0820@gmail.com
