name: iOS CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Install CocoaPods Dependencies
      run: |
        cd iosApp
        # 创建一个临时的 Podfile 来拉取 Firebase
        cat <<EOF > Podfile
        platform :ios, '15.0'
        target 'iosApp' do
          use_frameworks!
          pod 'FirebaseDatabase'
          pod 'FirebaseCore'
        end
        EOF
        pod install

    - name: Build Kotlin Framework
      run: ./gradlew :shared:linkReleaseFrameworkIosArm64

    - name: Build iOS App (Unsigned)
      run: |
        cd iosApp
        # 使用 .xcworkspace 而不是 .xcodeproj 来包含 Pods 依赖
        xcodebuild -workspace iosApp.xcworkspace \
                   -scheme iosApp \
                   -sdk iphoneos \
                   -configuration Release \
                   -derivedDataPath build \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   FRAMEWORK_SEARCH_PATHS="\$(pwd)/../shared/build/bin/iosArm64/releaseFramework" \
                   OTHER_LDFLAGS="-framework Shared" \
                   build

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-app-unsigned
        path: iosApp/build/Build/Products/Release-iphoneos/*.app

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-app-unsigned
        path: iosApp/build/Build/Products/Release-iphoneos/*.app
