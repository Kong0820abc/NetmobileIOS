name: iOS CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Install CocoaPods Dependencies
      run: |
        cd iosApp
        cat <<EOF > Podfile
        platform :ios, '15.0'
        install! 'cocoapods', :deterministic_uuids => false
        target 'iosApp' do
          use_frameworks! :linkage => :static
          pod 'FirebaseDatabase'
          pod 'FirebaseCore'
        end

        post_install do |installer|
          installer.generated_projects.each do |project|
            project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
                config.build_settings['ENABLE_BITCODE'] = 'NO'
                config.build_settings['APPLICATION_EXTENSION_API_ONLY'] = 'NO'
                config.build_settings['BUILD_LIBRARY_FOR_DISTRIBUTION'] = 'YES'
                config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'
              end
            end
          end
        end
        EOF
        pod install --repo-update

    - name: Build Kotlin Framework
      run: ./gradlew :shared:linkReleaseFrameworkIosArm64

    - name: Build iOS App (Unsigned Archive)
      run: |
        cd iosApp
        SCHEME_NAME=$(xcodebuild -workspace iosApp.xcworkspace -list | grep -A 10 "Schemes:" | tail -n +2 | xargs | cut -d ' ' -f 1)
        echo "Detected Scheme: $SCHEME_NAME"
        
        # 使用 archive 模式，这是 iOS 打包的标准方式，路径 100% 可控
        xcodebuild -workspace iosApp.xcworkspace \
                   -scheme "$SCHEME_NAME" \
                   -configuration Release \
                   -archivePath build/Netmobile.xcarchive \
                   archive \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_IDENTITY="" \
                   AD_HOC_CODE_SIGNING_ALLOWED=YES \
                   ENABLE_USER_SCRIPT_SANDBOXING=NO \
                   IS_APPLE_CODE_SIGN_PARAMETER_REQUIRED=NO \
                   FRAMEWORK_SEARCH_PATHS="$(pwd)/../shared/build/bin/iosArm64/releaseFramework"

    - name: Prepare Artifact for Upload
      run: |
        # 1. 创建确定的上传目录
        mkdir -p final_output
        
        # 2. 深度搜索归档包内的所有 .app 文件夹并打印出来（调试用）
        echo "Searching for the app inside the archive..."
        find iosApp/build/Netmobile.xcarchive -name "*.app" -type d
        
        # 3. 强力提取：找到第一个 .app 并拷贝到 final_output
        # 使用 -exec 配合引处理带空格的文件名
        find iosApp/build/Netmobile.xcarchive -name "*.app" -type d -exec cp -R "{}" final_output/ \;
        
        # 4. 确认提取结果
        echo "Final output content:"
        ls -R final_output

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-app-unsigned
        path: final_output/
        if-no-files-found: error
