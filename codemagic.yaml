workflows:
  ios-unsigned-workflow:
    name: iOS Unsigned Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - sdk_versions
      vars:
        XCODE_WORKSPACE: "iosApp/iosApp.xcworkspace"
        XCODE_SCHEME: "iosApp"
      node: 20
      java: 17
      xcode: latest
    scripts:
      - name: Set execute permission for gradlew
        script: chmod +x gradlew
      - name: Install CocoaPods
        script: |
          cd iosApp
          cat <<EOF > Podfile
          platform :ios, '15.0'
          use_modular_headers!
          
          target 'iosApp' do
            use_frameworks! :linkage => :static
            pod 'FirebaseDatabase'
            pod 'FirebaseCore'
            pod 'FirebaseCoreInternal'
            pod 'GoogleUtilities'
          end

          post_install do |installer|
            installer.generated_projects.each do |project|
              project.targets.each do |target|
                target.build_configurations.each do |config|
                  config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
                  config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                  config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                  config.build_settings['CODE_SIGN_IDENTITY'] = ''
                  config.build_settings['DEFINES_MODULE'] = 'YES'
                  config.build_settings['CLANG_ENABLE_MODULES'] = 'YES'
                  config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'
                  config.build_settings['GCC_WARN_INHIBIT_ALL_WARNINGS'] = 'YES'
                end
              end
            end
          end
          EOF
          pod install
      - name: Build KMP Framework
        script: |
          # 核心修复：编译模拟器版本框架
          ./gradlew :shared:linkReleaseFrameworkIosSimulatorArm64
      - name: Build iOS App
        script: |
          set -o pipefail
          # 核心修复：添加 ASSETCATALOG_COMPILER_APPICON_NAME 声明并锁定 SDK
          xcodebuild build -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            OTHER_LDFLAGS="\$(inherited) -ObjC -Wl,-ld64" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon
    artifacts:
      - iosApp/build/ios/iphonesimulator/*.app
      - build/ios/iphonesimulator/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Release-iphonesimulator/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Release-iphonesimulator/*.app.zip
    publishing:
      email:
        recipients:
          - kong0820kong0820@gmail.com # 构建完成后会发邮件通知你
        notify:
          success: true
          failure: true
