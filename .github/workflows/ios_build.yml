name: iOS CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Install CocoaPods Dependencies
      run: |
        cd iosApp
        cat <<EOF > Podfile
        platform :ios, '15.0'
        install! 'cocoapods', :deterministic_uuids => false
        target 'iosApp' do
          use_frameworks! :linkage => :static
          pod 'FirebaseDatabase'
          pod 'FirebaseCore'
        end

        post_install do |installer|
          installer.generated_projects.each do |project|
            project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
                config.build_settings['ENABLE_BITCODE'] = 'NO'
              end
            end
          end
        end
        EOF
        pod install --repo-update

    - name: Build Kotlin Framework
      run: ./gradlew :shared:linkReleaseFrameworkIosArm64

    - name: Build iOS App (Unsigned)
      run: |
        cd iosApp
        # 深度修正的 Scheme 提取逻辑：过滤掉标题行、Pods 和 Firebase 相关的干扰项
        SCHEME_NAME=$(xcodebuild -workspace iosApp.xcworkspace -list | grep -v "Schemes:" | grep -A 20 "Information about workspace" | grep -v "Information about workspace" | grep -v "Pods-" | grep -v "Firebase" | grep -v "Google" | grep -v "nanopb" | grep -v "leveldb" | grep -v "Promises" | xargs | cut -d ' ' -f 1)
        
        # 如果自动检测落空，则强制指定
        if [ -z "$SCHEME_NAME" ] || [ "$SCHEME_NAME" = "Schemes:" ]; then SCHEME_NAME="iosApp"; fi
        
        echo "Final Targeting App Scheme: $SCHEME_NAME"
        
        mkdir -p ../build_results
        
        xcodebuild -workspace iosApp.xcworkspace \
                   -scheme "$SCHEME_NAME" \
                   -configuration Release \
                   -sdk iphoneos \
                   -derivedDataPath derived_data \
                   CONFIGURATION_BUILD_DIR=$(pwd)/../build_results \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_IDENTITY="" \
                   AD_HOC_CODE_SIGNING_ALLOWED=YES \
                   ENABLE_USER_SCRIPT_SANDBOXING=NO \
                   COMPILER_INDEX_STORE_ENABLE=NO \
                   IS_APPLE_CODE_SIGN_PARAMETER_REQUIRED=NO \
                   FRAMEWORK_SEARCH_PATHS="$(pwd)/../shared/build/bin/iosArm64/releaseFramework" \
                   build

    - name: Prepare Artifact for Upload
      run: |
        mkdir -p final_payload
        # 现在路径绝对正确了：从结果目录中提取真正的 .app
        find build_results -name "*.app" -type d -exec cp -R "{}" final_payload/ \;
        echo "Archive Summary:"
        ls -R final_payload

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-app-unsigned
        path: final_payload/
        if-no-files-found: error
