name: iOS CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Install CocoaPods Dependencies
      run: |
        cd iosApp
        rm -rf Pods Podfile.lock iosApp.xcworkspace
        
        cat <<EOF > Podfile
        platform :ios, '15.0'
        use_modular_headers!
        
        target 'iosApp' do
          # 静态链接最稳定
          use_frameworks! :linkage => :static
          pod 'FirebaseDatabase'
          pod 'FirebaseCore'
          pod 'FirebaseCoreInternal'
          pod 'GoogleUtilities'
        end

        post_install do |installer|
          installer.pods_project.targets.each do |target|
            target.build_configurations.each do |config|
              config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
              config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
              config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
              config.build_settings['CODE_SIGN_IDENTITY'] = ''
              # 解决 Xcode 16 模块化冲突
              config.build_settings['DEFINES_MODULE'] = 'YES'
              config.build_settings['CLANG_ENABLE_MODULES'] = 'YES'
              config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'
              config.build_settings['GCC_WARN_INHIBIT_ALL_WARNINGS'] = 'YES'
            end
          end
        end
        EOF
        pod install --repo-update

    - name: Build Kotlin Framework
      run: ./gradlew :shared:linkReleaseFrameworkIosArm64

    - name: Build and Archive iOS App
      run: |
        cd iosApp
        # 开启 pipefail 确保 xcodebuild 的失败能被捕获
        set -o pipefail
        
        xcodebuild -workspace iosApp.xcworkspace \
                   -scheme iosApp \
                   -configuration Release \
                   -destination 'generic/platform=iOS' \
                   -archivePath build/App.xcarchive \
                   archive \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_IDENTITY="" \
                   AD_HOC_CODE_SIGNING_ALLOWED=YES \
                   ENABLE_USER_SCRIPT_SANDBOXING=NO \
                   COMPILER_INDEX_STORE_ENABLE=NO \
                   SKIP_INSTALL=NO 2>&1 | tee xcodebuild.log || (echo "Linker or Compiler error details:" && grep -i "error: " xcodebuild.log | head -n 20 && grep -i "ld: " xcodebuild.log | head -n 20 && exit 1)

    - name: Extract App from Archive
      run: |
        mkdir -p final_output
        APP_PATH=$(find iosApp/build/App.xcarchive -name "*.app" -type d | head -n 1)
        if [ -n "$APP_PATH" ]; then
          cp -R "$APP_PATH" "final_output/"
          echo "Successfully captured: $APP_PATH"
        else
          echo "Error: .app file not found in archive!"
          exit 1
        fi

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-app-unsigned
        path: final_output/
        if-no-files-found: error
