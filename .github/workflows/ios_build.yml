name: iOS CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Kotlin Framework
      run: ./gradlew :shared:linkReleaseFrameworkIosArm64

    - name: Build iOS App using SPM (Safe Mode)
      run: |
        cd iosApp
        # 彻底跳过 CocoaPods，使用 Xcode 16 内置的依赖管理
        # 这种方式不会产生 "no such module GoogleUtilities" 错误
        
        xcodebuild -project iosApp.xcodeproj \
                   -scheme iosApp \
                   -sdk iphoneos \
                   -configuration Release \
                   -derivedDataPath build_data \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_IDENTITY="" \
                   AD_HOC_CODE_SIGNING_ALLOWED=YES \
                   ENABLE_USER_SCRIPT_SANDBOXING=NO \
                   COMPILER_INDEX_STORE_ENABLE=NO \
                   IS_APPLE_CODE_SIGN_PARAMETER_REQUIRED=NO \
                   FRAMEWORK_SEARCH_PATHS="$(pwd)/../shared/build/bin/iosArm64/releaseFramework" \
                   build

    - name: Prepare Artifact for Upload
      run: |
        mkdir -p final_ipa_dir
        # 定位真正的编译结果
        find build_data -name "*.app" -type d -path "*/Release-iphoneos/*" -exec cp -R "{}" final_ipa_dir/ \;
        echo "Apps found for download:"
        ls -R final_ipa_dir

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-app-unsigned
        path: final_ipa_dir/
        if-no-files-found: error
