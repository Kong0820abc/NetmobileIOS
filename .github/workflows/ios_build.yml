name: iOS CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Install CocoaPods Dependencies
      run: |
        cd iosApp
        cat <<EOF > Podfile
        platform :ios, '15.0'
        install! 'cocoapods', :deterministic_uuids => false
        target 'iosApp' do
          use_frameworks!
          pod 'FirebaseDatabase'
          pod 'FirebaseCore'
        end

        post_install do |installer|
          installer.generated_projects.each do |project|
            project.targets.each do |target|
              target.build_configurations.each do |config|
                # 核心修复：解决 'no such module' 错误
                config.build_settings['DEFINES_MODULE'] = 'YES'
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
                config.build_settings['ENABLE_BITCODE'] = 'NO'
              end
            end
          end
        end
        EOF
        pod install --repo-update

    - name: Build Kotlin Framework
      run: ./gradlew :shared:linkReleaseFrameworkIosArm64

    - name: Build iOS App (Unsigned)
      run: |
        cd iosApp
        # 获取真正的 Scheme 名字
        SCHEME_NAME=$(xcodebuild -workspace iosApp.xcworkspace -list | grep -v "Schemes:" | grep -A 20 "Information about workspace" | grep -v "Information about workspace" | grep -v "Pods-" | grep -v "Firebase" | grep -v "Google" | grep -v "nanopb" | grep -v "leveldb" | grep -v "Promises" | xargs | cut -d ' ' -f 1)
        if [ -z "$SCHEME_NAME" ] || [ "$SCHEME_NAME" = "Schemes:" ]; then SCHEME_NAME="iosApp"; fi
        echo "Final Targeting App Scheme: $SCHEME_NAME"

        xcodebuild -workspace iosApp.xcworkspace \
                   -scheme "$SCHEME_NAME" \
                   -sdk iphoneos \
                   -configuration Release \
                   -derivedDataPath build_data \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_IDENTITY="" \
                   AD_HOC_CODE_SIGNING_ALLOWED=YES \
                   ENABLE_USER_SCRIPT_SANDBOXING=NO \
                   COMPILER_INDEX_STORE_ENABLE=NO \
                   IS_APPLE_CODE_SIGN_PARAMETER_REQUIRED=NO \
                   FRAMEWORK_SEARCH_PATHS="$(pwd)/../shared/build/bin/iosArm64/releaseFramework" \
                   build

    - name: Prepare Artifact for Upload
      run: |
        mkdir -p final_ipa_dir
        # 排除 Pods 目录，只抓取主 App 编译结果
        find . -name "*.app" -type d -not -path "*/Pods/*" -exec cp -R "{}" final_ipa_dir/ \;
        echo "Content of final_ipa_dir:"
        ls -R final_ipa_dir

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-app-unsigned
        path: final_ipa_dir/
        if-no-files-found: error
