name: iOS CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Install CocoaPods Dependencies
      run: |
        cd iosApp
        # 清理可能存在的残留
        rm -rf Pods Podfile.lock iosApp.xcworkspace
        
        cat <<EOF > Podfile
        platform :ios, '15.0'
        # 强制所有库使用模块化头文件
        use_modular_headers!
        
        target 'iosApp' do
          # 核心修复：使用静态链接，这是处理 Firebase 模块报错最有效的方法
          use_frameworks! :linkage => :static
          pod 'FirebaseDatabase'
          pod 'FirebaseCore'
          pod 'GoogleUtilities'
        end

        post_install do |installer|
          installer.generated_projects.each do |project|
            project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
                config.build_settings['ENABLE_BITCODE'] = 'NO'
                config.build_settings['DEFINES_MODULE'] = 'YES'
                config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'
              end
            end
          end
        end
        EOF
        pod install --repo-update

    - name: Build Kotlin Framework
      run: ./gradlew :shared:linkReleaseFrameworkIosArm64

    - name: Build iOS App (Unsigned)
      run: |
        cd iosApp
        # 强制锁定 iosApp 方案
        xcodebuild -workspace iosApp.xcworkspace \
                   -scheme iosApp \
                   -sdk iphoneos \
                   -configuration Release \
                   -derivedDataPath build_data \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_IDENTITY="" \
                   AD_HOC_CODE_SIGNING_ALLOWED=YES \
                   ENABLE_USER_SCRIPT_SANDBOXING=NO \
                   IS_APPLE_CODE_SIGN_PARAMETER_REQUIRED=NO \
                   COMPILER_INDEX_STORE_ENABLE=NO \
                   FRAMEWORK_SEARCH_PATHS="$(pwd)/../shared/build/bin/iosArm64/releaseFramework" \
                   OTHER_SWIFT_FLAGS="-Xcc -Wno-error=non-modular-include-in-framework-module" \
                   build

    - name: Prepare Artifact for Upload
      run: |
        mkdir -p final_ipa_dir
        # 全盘扫描真正的 .app 文件夹并提取，排除 Pods 目录
        find . -name "*.app" -type d -not -path "*/Pods/*" -exec cp -R "{}" final_ipa_dir/ \;
        echo "Successfully Captured App for download:"
        ls -R final_ipa_dir

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-app-unsigned
        path: final_ipa_dir/
        if-no-files-found: error
