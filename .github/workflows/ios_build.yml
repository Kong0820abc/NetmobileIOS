name: iOS CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Install CocoaPods Dependencies
      run: |
        cd iosApp
        rm -rf Pods Podfile.lock iosApp.xcworkspace
        
        cat <<EOF > Podfile
        platform :ios, '15.0'
        use_modular_headers!
        
        target 'iosApp' do
          use_frameworks! :linkage => :static
          pod 'FirebaseDatabase'
          pod 'FirebaseCore'
          pod 'FirebaseCoreInternal'
          pod 'GoogleUtilities'
        end

        post_install do |installer|
          installer.pods_project.targets.each do |target|
            target.build_configurations.each do |config|
              config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
              config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
              config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
              config.build_settings['CODE_SIGN_IDENTITY'] = ''
              config.build_settings['DEFINES_MODULE'] = 'YES'
              config.build_settings['CLANG_ENABLE_MODULES'] = 'YES'
              config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'
              config.build_settings['GCC_WARN_INHIBIT_ALL_WARNINGS'] = 'YES'
            end
          end
          # 核心修复：手动将 GoogleUtilities 的框架路径注入主 Target，解决 UIUtilities 找不到的问题
          installer.aggregate_targets.each do |target|
            target.xcconfigs.each do |name, config|
              config.attributes['FRAMEWORK_SEARCH_PATHS'] ||= '$(inherited)'
              config.attributes['FRAMEWORK_SEARCH_PATHS'] << ' $(PODS_CONFIGURATION_BUILD_DIR)/GoogleUtilities'
            end
          end
        end
        EOF
        pod install --repo-update

    - name: Build Kotlin Framework
      run: ./gradlew :shared:linkReleaseFrameworkIosArm64

    - name: Prepare Framework for Xcode
      run: |
        # 将框架直接拷贝到 iosApp 目录，配合 Config.xcconfig 中的 $(PROJECT_DIR)
        cp -R shared/build/bin/iosArm64/releaseFramework/Shared.framework iosApp/
        ls -d iosApp/Shared.framework

    - name: Build iOS App
      run: |
        cd iosApp
        set -o pipefail
        # 使用 build 代替 archive，并明确指定真机 SDK
        xcodebuild build -workspace iosApp.xcworkspace \
                   -scheme iosApp \
                   -configuration Release \
                   -sdk iphoneos \
                   -destination 'generic/platform=iOS' \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_IDENTITY="" \
                   AD_HOC_CODE_SIGNING_ALLOWED=YES \
                   ENABLE_USER_SCRIPT_SANDBOXING=NO \
                   COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee xcodebuild.log || (grep -i "error: " xcodebuild.log | head -n 20 && grep -i "ld: " xcodebuild.log | head -n 20 && exit 1)

    - name: Extract App from Build
      run: |
        mkdir -p final_output
        # build 指令生成的 .app 路径比较固定
        APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Turf Mobile.app" -type d | head -n 1)
        if [ -n "$APP_PATH" ]; then
          cp -R "$APP_PATH" "final_output/"
          echo "Successfully captured: $APP_PATH"
        else
          echo "Error: .app file not found in DerivedData!"
          # 备用方案：尝试在当前目录寻找
          APP_PATH=$(find iosApp/build -name "*.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
             cp -R "$APP_PATH" "final_output/"
          else
             exit 1
          fi
        fi

    - name: Extract App from Archive
      run: |
        mkdir -p final_output
        APP_PATH=$(find iosApp/build/App.xcarchive -name "*.app" -type d | head -n 1)
        if [ -n "$APP_PATH" ]; then
          cp -R "$APP_PATH" "final_output/"
          echo "Successfully captured: $APP_PATH"
        else
          echo "Error: .app file not found in archive!"
          exit 1
        fi

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-app-unsigned
        path: final_output/
        if-no-files-found: error
