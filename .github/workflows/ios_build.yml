name: iOS CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Install CocoaPods Dependencies
      run: |
        cd iosApp
        rm -rf Pods Podfile.lock iosApp.xcworkspace
        
        cat <<EOF > Podfile
        platform :ios, '15.0'
        use_modular_headers!
        
        target 'iosApp' do
          # 静态链接最稳定
          use_frameworks! :linkage => :static
          pod 'FirebaseDatabase'
          pod 'FirebaseCore'
          pod 'FirebaseCoreInternal'
          pod 'GoogleUtilities'
        end

        post_install do |installer|
          installer.pods_project.targets.each do |target|
            target.build_configurations.each do |config|
              config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
              config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
              config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
              config.build_settings['CODE_SIGN_IDENTITY'] = ''
              config.build_settings['GCC_WARN_INHIBIT_ALL_WARNINGS'] = 'YES'
              config.build_settings['GCC_TREAT_WARNINGS_AS_ERRORS'] = 'NO'
              config.build_settings['DEFINES_MODULE'] = 'YES'
              config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'
            end
          end
        end
        EOF
        pod install --repo-update

    - name: Build Kotlin Framework
      run: ./gradlew :shared:linkReleaseFrameworkIosArm64

    - name: Build and Archive iOS App
      run: |
        cd iosApp
        # 获取 KMP 框架的绝对路径
        FRAMEWORK_DIR="$GITHUB_WORKSPACE/shared/build/bin/iosArm64/releaseFramework"
        
        # 核心设置：
        # 1. OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES 禁用 Xcode 内部的 Gradle 脚本
        # 2. 显式指定架构为 arm64，防止编译器尝试构建多架构导致链接失败
        # 3. 通过命令行注入框架搜索路径和链接标志，确保它们优先级最高
        
        xcodebuild -workspace iosApp.xcworkspace \
                   -scheme iosApp \
                   -configuration Release \
                   -archivePath build/App.xcarchive \
                   archive \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_IDENTITY="" \
                   AD_HOC_CODE_SIGNING_ALLOWED=YES \
                   ENABLE_USER_SCRIPT_SANDBOXING=NO \
                   OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES \
                   ARCHS=arm64 \
                   VALID_ARCHS=arm64 \
                   FRAMEWORK_SEARCH_PATHS="\$(inherited) '$FRAMEWORK_DIR'" \
                   OTHER_LDFLAGS="\$(inherited) -framework Shared -ObjC" \
                   SWIFT_INCLUDE_PATHS="\$(inherited) '$FRAMEWORK_DIR'" \
                   CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES=YES \
                   COMPILER_INDEX_STORE_ENABLE=NO \
                   SKIP_INSTALL=NO

    - name: Extract App from Archive
      run: |
        mkdir -p final_output
        APP_PATH=\$(find iosApp/build/App.xcarchive -name "*.app" -type d | head -n 1)
        if [ -n "\$APP_PATH" ]; then
          cp -R "\$APP_PATH" "final_output/"
          echo "Successfully captured: \$APP_PATH"
        else
          echo "Error: .app file not found in archive!"
          exit 1
        fi

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-app-unsigned
        path: final_output/
        if-no-files-found: error
