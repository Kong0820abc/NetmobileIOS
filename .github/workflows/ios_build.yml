name: iOS CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Install CocoaPods Dependencies
      run: |
        cd iosApp
        cat <<EOF > Podfile
        platform :ios, '15.0'
        install! 'cocoapods', :deterministic_uuids => false
        target 'iosApp' do
          use_frameworks! :linkage => :static
          pod 'FirebaseDatabase'
          pod 'FirebaseCore'
        end

        post_install do |installer|
          installer.generated_projects.each do |project|
            project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
                config.build_settings['ENABLE_BITCODE'] = 'NO'
              end
            end
          end
        end
        EOF
        pod install --repo-update

    - name: Build Kotlin Framework
      run: ./gradlew :shared:linkReleaseFrameworkIosArm64

    - name: Build iOS App (Unsigned)
      run: |
        cd iosApp
        SCHEME_NAME=$(xcodebuild -workspace iosApp.xcworkspace -list | grep -A 10 "Schemes:" | tail -n +2 | xargs | cut -d ' ' -f 1)
        echo "Detected Scheme: $SCHEME_NAME"
        
        mkdir -p ../build_output
        
        xcodebuild -workspace iosApp.xcworkspace \
                   -scheme "$SCHEME_NAME" \
                   -sdk iphoneos \
                   -configuration Release \
                   -derivedDataPath build \
                   CONFIGURATION_BUILD_DIR=$(pwd)/../build_output \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_IDENTITY="" \
                   AD_HOC_CODE_SIGNING_ALLOWED=YES \
                   ENABLE_USER_SCRIPT_SANDBOXING=NO \
                   COMPILER_INDEX_STORE_ENABLE=NO \
                   IS_APPLE_CODE_SIGN_PARAMETER_REQUIRED=NO \
                   FRAMEWORK_SEARCH_PATHS="$(pwd)/../shared/build/bin/iosArm64/releaseFramework" \
                   build

    - name: Prepare Artifact for Upload
      run: |
        # 1. 扫描所有 .app 文件并打印路径（调试用）
        echo "Searching for built apps..."
        find . -name "*.app" -type d
        
        # 2. 创建一个纯净的上传目录
        mkdir -p final_app_dir
        
        # 3. 将找到的所有 .app 文件拷贝过去，并去掉路径中的空格隐患
        find . -name "*.app" -type d -exec cp -R {} final_app_dir/ \;
        
        # 4. 确认目录内容
        ls -R final_app_dir

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-app-unsigned
        path: final_app_dir/
        if-no-files-found: error
