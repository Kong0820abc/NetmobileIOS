name: iOS CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Install CocoaPods Dependencies
      run: |
        cd iosApp
        cat <<EOF > Podfile
        platform :ios, '15.0'
        
        # 核心修复：强制开启模块化，确保 Swift 能找到 ObjC 模块
        use_modular_headers!
        
        target 'iosApp' do
          use_frameworks!
          pod 'FirebaseDatabase'
          pod 'FirebaseCore'
          pod 'GoogleUtilities'
        end

        post_install do |installer|
          installer.generated_projects.each do |project|
            project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
                config.build_settings['ENABLE_BITCODE'] = 'NO'
                # 显式允许非模块化包含，双重保险
                config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'
                config.build_settings['DEFINES_MODULE'] = 'YES'
              end
            end
          end
        end
        EOF
        pod install --repo-update

    - name: Build Kotlin Framework
      run: ./gradlew :shared:linkReleaseFrameworkIosArm64

    - name: Build iOS App (Unsigned)
      run: |
        cd iosApp
        xcodebuild -workspace iosApp.xcworkspace \
                   -scheme iosApp \
                   -sdk iphoneos \
                   -configuration Release \
                   -derivedDataPath build_data \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_IDENTITY="" \
                   AD_HOC_CODE_SIGNING_ALLOWED=YES \
                   ENABLE_USER_SCRIPT_SANDBOXING=NO \
                   COMPILER_INDEX_STORE_ENABLE=NO \
                   IS_APPLE_CODE_SIGN_PARAMETER_REQUIRED=NO \
                   FRAMEWORK_SEARCH_PATHS="$(pwd)/../shared/build/bin/iosArm64/releaseFramework" \
                   CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES=YES \
                   build

    - name: Prepare Artifact for Upload
      run: |
        mkdir -p final_ipa_dir
        # 深度扫描并提取真正的 .app，确保不包含 Pods 目录下的临时编译物
        find build_data -name "*.app" -type d -path "*/Release-iphoneos/*" -exec cp -R "{}" final_ipa_dir/ \;
        echo "Final result content:"
        ls -R final_ipa_dir

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-app-unsigned
        path: final_ipa_dir/
        if-no-files-found: error
